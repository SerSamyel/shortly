[project]
name = "shortly"
version = "0.1.0"
description = "URL shortener with click analytics"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiokafka>=0.12",
    "alembic>=1.16",
    "argon2-cffi>=25.1",
    "asyncpg>=0.30",
    "fastapi>=0.120",
    "maxminddb>=2.8",
    "pydantic[email]>=2.12",
    "pydantic-settings>=2.11",
    "pyjwt>=2.10",
    "redis>=6.4",
    "sqlalchemy[asyncio]>=2.0.44",
    "uvicorn[standard]>=0.38",
]

[project.scripts]
shortly-consumer = "shortly.consumer:main"

[dependency-groups]
dev = [
    "aiosqlite>=0.21",
    "httpx>=0.28",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "ruff>=0.14",
]

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
